<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>BarcodeCraft</title>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="fonts/fonts-list.js"></script>
<style>
  :root {
    --bg: #f3f5f8;
    --panel: #ffffff;
    --fg: #20232a;
    --line: #d9dde3;
    --muted: #6b7280;
    --accent: #2f6fdd;
    --accent-rgb: 47,111,221;
    --accent-contrast: #ffffff;
    --desk: #e6e9ef;
    --tb: #20232a;
    --tb-fg: #f4f5f7;
    --shadow: 0 2px 12px rgba(0, 0, 0, .15);
  }
  [data-theme=dark] {
    --bg: #16181d;
    --panel: #1f2228;
    --fg: #e7e9ee;
    --line: #3a3f47;
    --muted: #9aa1ab;
    --accent: #4c8df5;
    --accent-rgb: 76,141,245;
    --accent-contrast: #0b0d12;
    --desk: #101217;
    --tb: #0d0e12;
    --tb-fg: #f4f5f7;
    --shadow: 0 2px 12px rgba(0, 0, 0, .5);
  }
  [data-accent=cyan] { --accent: #0e9faf; --accent-rgb: 14,159,175; --accent-contrast: #ffffff; }
  [data-accent=emerald] { --accent: #0f9d6e; --accent-rgb: 15,157,110; --accent-contrast: #ffffff; }
  [data-accent=violet] { --accent: #7c3aed; --accent-rgb: 124,58,237; --accent-contrast: #ffffff; }
  [data-accent=amber] { --accent: #b45309; --accent-rgb: 180,83,9; --accent-contrast: #ffffff; }
  [data-accent=rose] { --accent: #be123c; --accent-rgb: 190,18,60; --accent-contrast: #ffffff; }
  [data-theme=dark][data-accent=cyan] { --accent: #22d3ee; --accent-rgb: 34,211,238; --accent-contrast: #06252b; }
  [data-theme=dark][data-accent=emerald] { --accent: #34d399; --accent-rgb: 52,211,153; --accent-contrast: #052e20; }
  [data-theme=dark][data-accent=violet] { --accent: #a78bfa; --accent-rgb: 167,139,250; --accent-contrast: #1e1144; }
  [data-theme=dark][data-accent=amber] { --accent: #fbbf24; --accent-rgb: 251,191,36; --accent-contrast: #3a2504; }
  [data-theme=dark][data-accent=rose] { --accent: #fb7185; --accent-rgb: 251,113,133; --accent-contrast: #430611; }
  [data-contrast=more] {
    --line: #98a0ad;
    --muted: #4f5766;
  }
  [data-theme=dark][data-contrast=more] {
    --line: #7c8695;
    --muted: #cdd4de;
  }
  * { box-sizing: border-box; }
  :where(button, input, select, textarea, [tabindex]):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 13px;
    color: var(--fg);
    background: var(--bg);
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; }
  .app > * { min-width: 0; }

  /* ---- title bar ---- */
  .titlebar {
    display: flex; align-items: center; gap: 6px;
    background: var(--tb); color: var(--tb-fg);
    padding: 4px 8px; user-select: none;
  }
  .tb-logo {
    border: 0; background: none; cursor: pointer; padding: 3px; border-radius: 6px;
    display: grid; place-items: center; color: var(--tb-fg);
  }
  .tb-logo:hover { background: rgba(255,255,255,.12); }
  .tb-brand { font-weight: 600; letter-spacing: .3px; margin-right: 8px; font-size: 14px; white-space: nowrap; }
  .tb-brand b { color: #f2b400; font-weight: 700; }
  .tb-name { color: rgba(255,255,255,.75); font-size: 12.5px; white-space: nowrap; margin-left: 4px; }
  .tb-menus { display: flex; align-items: center; }
  .menu { position: relative; }
  .menu-btn {
    border: 0; background: none; color: var(--tb-fg); cursor: pointer;
    padding: 6px 10px; border-radius: 5px; font-size: 13px;
  }
  .menu-btn:hover { background: rgba(255,255,255,.12); }
  .tb-spacer { flex: 1; }
  .tb-search input {
    width: 220px; border: 1px solid transparent; border-radius: 6px;
    background: rgba(255,255,255,.1); color: var(--tb-fg);
    padding: 5px 8px; outline: none;
  }
  .tb-search input::placeholder { color: rgba(255,255,255,.5); }
  .tb-search input:focus { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.25); }
  .tb-quick { display: flex; align-items: center; gap: 2px; }
  .tb-quick { min-width: 0; max-width: 100%; }
  .tb-btn {
    border: 0; background: none; color: var(--tb-fg); cursor: pointer;
    width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center;
  }
  .tb-btn:hover { background: rgba(255,255,255,.12); }
  .tb-btn svg { width: 17px; height: 17px; }

  /* ---- menus (dropdown) ---- */
  .menu-list {
    position: fixed; z-index: 1000; width: 280px; min-width: 280px; max-width: min(320px, calc(100vw - 16px));
    background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
    padding: 4px; max-height: 70vh; overflow: auto;
  }
  .menu-item {
    display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center;
    width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
    padding: 8px 9px; border-radius: 6px; font-size: 13px; min-height: 34px;
  }
  .menu-item:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .menu-item:disabled { opacity: .4; cursor: default; }
  .menu-check { text-align: center; }
  .menu-key { color: var(--muted); font-size: 11px; }
  .menu-item:hover:not(:disabled) .menu-key { color: rgba(255,255,255,.8); }
  .menu-sep { height: 1px; background: var(--line); margin: 4px 6px; }
  .menu-heading { padding: 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

  /* ---- ribbon ---- */
  .ribbon { background: var(--panel); border-bottom: 1px solid var(--line); }
  .rb-tabs { display: flex; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .rb-tab {
    border: 0; background: none; cursor: pointer; padding: 7px 14px;
    font-size: 13px; color: var(--fg); border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .rb-tab:hover { background: rgba(0,0,0,.04); }
  .rb-tab.active { border-bottom-color: var(--tab-hue, var(--accent)); color: var(--tab-hue, var(--accent)); font-weight: 600; }
  .rb-groups { display: flex; align-items: stretch; gap: 0; padding: 8px; flex-wrap: wrap; }
  .rb-group { display: flex; flex-direction: column; padding: 0 12px; border-right: 1px solid var(--line); }
  .rb-group:last-child { border-right: 0; }
  .rb-gname { font-size: 11px; color: var(--muted); margin-bottom: 5px; text-align: center; }
  .rb-btns { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
  .rb-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 0; background: none; cursor: pointer; padding: 5px 9px; border-radius: 7px;
    font-size: 11.5px; color: var(--fg); min-width: 52px;
  }
  .rb-btn:hover { background: rgba(0,0,0,.06); }
  .rb-btn svg { width: 20px; height: 20px; }
  .rb-btn.rb-big { min-width: 64px; }
  .rb-btn.rb-icon { min-width: 44px; width: 44px; height: 44px; padding: 6px; justify-content: center; }
  .rb-btn.rb-icon svg { width: 20px; height: 20px; }
  .rb-menu-btn {
    display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); cursor: pointer; padding: 7px 10px;
    border-radius: 8px; font-size: 12.5px; min-height: 34px; white-space: nowrap;
  }
  .rb-menu-btn:hover { background: var(--bg); border-color: var(--accent); }
  .rb-menu-btn svg { width: 17px; height: 17px; }
  .rb-menu-btn .caret { width: 12px; height: 12px; margin-left: auto; opacity: .7; }

  .side-search { margin-bottom: 10px; }

  .modal-card.wide { width: min(720px, 100%); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    padding: 6px 10px; border-radius: 999px; cursor: pointer; font-size: 12px;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .insert-list { max-height: min(52vh, 440px); overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
  .insert-item {
    display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left;
    border: 0; background: none; cursor: pointer; padding: 9px 10px;
    border-bottom: 1px solid var(--line);
  }
  .insert-item:last-child { border-bottom: 0; }
  .insert-item:hover { background: var(--accent); color: #fff; }
  .insert-item:hover small, .insert-item:hover em { color: rgba(255,255,255,.85); }
  .insert-item .ins-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .insert-item .ins-name { font-size: 13px; font-weight: 600; }
  .insert-item small { font-family: "Consolas", "Courier New", monospace; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insert-item em { font-style: normal; color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }

  /* ---- work area ---- */
  .work { display: grid; grid-template-columns: 220px minmax(0, 1fr) 260px; min-height: 0; }
  .side { background: var(--panel); overflow: auto; padding: 10px; }
  .side { min-height: 0; max-height: 100%; overscroll-behavior: contain; }
  .side.left { border-right: 1px solid var(--line); }
  .side.left { display: flex; flex-direction: column; }
  .side.left > #type-list { flex: 1 1 auto; min-height: 120px; max-height: min(46vh, 520px); overflow: auto; padding-right: 2px; }
  .side.left .sec { flex: 0 0 auto; }
  .side.right { border-left: 1px solid var(--line); }
  .side.right { display: flex; flex-direction: column; }
  .right-tabs { display: flex; gap: 6px; margin-bottom: 8px; flex: 0 0 auto; }
  .right-tab {
    flex: 1; border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    border-radius: 7px; padding: 7px 6px; font-size: 12px; cursor: pointer; min-height: 34px;
  }
  .right-tab.active { border-color: var(--accent); color: var(--fg); background: rgba(var(--accent-rgb), .10); font-weight: 600; }
  .right-content { min-height: 0; overflow: auto; flex: 1 1 auto; }
  .right-body { display: flex; flex-direction: column; }
  .side-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
  .panel-close { display: none; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 7px; border-radius: 6px; }
  .panel-close:hover { background: var(--bg); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 890; }
  .scrim[hidden] { display: none; }
  .sec { margin-bottom: 14px; }
  .sec h3 { font-size: 12px; margin: 10px 0 6px; color: var(--muted); font-weight: 600; }
  .side-sec { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .side-sec summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .side-sec[open] summary { margin-bottom: 8px; }
  .field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
  .field span { font-size: 12px; color: var(--muted); }
  .row { display: flex; gap: 8px; min-width: 0; }
  .row .field { flex: 1; min-width: 0; }
  .input {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--fg); padding: 6px 8px; outline: none; caret-color: var(--accent);
  }
  .field .input, .field select, .field textarea { min-width: 0; }
  .input:focus { border-color: var(--accent); color: var(--fg); }
  .input::placeholder { color: color-mix(in srgb, var(--muted) 68%, transparent); }
  input[type="number"], input[type="color"], input[type="search"] { color: var(--fg); }
  textarea.input { resize: vertical; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); cursor: pointer;
    padding: 7px 12px; border-radius: 6px; font-size: 13px;
  }
  .btn:hover { background: var(--bg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.outline { background: none; }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .check { display: flex; gap: 7px; align-items: center; font-size: 13px; margin: 8px 0; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .side-actions { display: flex; flex-direction: column; gap: 6px; }
  .side-actions .btn { width: 100%; text-align: left; }
  .btn-with-icon { display: inline-flex; align-items: center; gap: 8px; }
  .btn-with-icon svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .icon-btn { width: 34px; min-width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn.wide { width: auto; min-width: 34px; padding: 0 8px; gap: 5px; }
  #obj-delete { width: 100%; justify-content: center; margin-top: 6px; }
  .layer-row { border: 1px solid transparent; border-radius: 7px; padding: 4px; }
  .layer-row.active { border-color: var(--accent); background: rgba(var(--accent-rgb), .08); }
  .layers-list { display: flex; flex-direction: column; gap: 5px; }
  .icon-sm { width: 32px; min-width: 32px; padding: 4px 6px; font-size: 14px; line-height: 1; text-align: center; }
  .layers-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .layers-toolbar .btn { flex: 1; padding: 7px 6px; font-size: 12px; }
  .layers-toolbar .icon-sm { flex: 0 0 32px; width: 32px; min-width: 32px; padding: 0; }
  .layer-filters { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 10px; }
  .layer-search { min-height: 32px; font-size: 12px; padding: 6px 8px; }
  .layer-filter-bar { display: flex; flex-wrap: wrap; gap: 5px; }
  .layer-filter {
    flex: 1; min-width: 34px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 999px; padding: 5px 7px; font-size: 11px; cursor: pointer;
  }
  .layer-filter.active { border-color: var(--accent); background: rgba(var(--accent-rgb), .12); color: var(--fg); font-weight: 600; }
  .layer-count { font-size: 11px; color: var(--muted); margin: -2px 0 0 2px; }
  .layer-row {
    display: grid; grid-template-columns: 18px 26px minmax(0, 1fr) 26px 44px 26px 26px 26px 26px;
    gap: 3px; align-items: center; padding: 4px; border: 1px solid transparent; border-radius: 8px;
  }
  .layer-row.hidden-layer { opacity: .5; }
  .layer-row.dragging { opacity: .35; }
  .layer-row.drop-before { box-shadow: 0 -2px 0 0 var(--accent); }
  .layer-row.drop-after { box-shadow: 0 2px 0 0 var(--accent); }
  .layer-row.child { padding-left: 8px; grid-template-columns: 16px 26px minmax(0, 1fr) 26px 44px; }
  .layer-expander { width: 16px; min-width: 16px; display: inline-grid; place-items: center; color: var(--muted); font-size: 11px; }
  .layer-expander.placeholder { pointer-events: none; }
  .layer-check-spacer { width: 16px; min-width: 16px; }
  .layer-children { display: flex; flex-direction: column; gap: 4px; margin: 2px 0 2px 11px; padding-left: 8px; border-left: 1px dashed var(--line); }
  .layer-select {
    min-width: 0; display: flex; align-items: center; gap: 6px; text-align: left;
    border: 0; background: none; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .layer-select:hover { background: rgba(0,0,0,.06); }
  .layer-select .layer-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .layer-select .layer-meta { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .layer-icon {
    border: 0; background: none; cursor: pointer; width: 26px; height: 26px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted);
  }
  .layer-icon:hover { background: rgba(0,0,0,.07); color: var(--fg); }
  .layer-icon svg { width: 16px; height: 16px; }
  .layer-icon.on { color: var(--fg); }
  .layer-check { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .layer-opacity { width: 44px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 3px 4px; font-size: 11px; text-align: center; }
  .only-mobile { display: none; }

  .list-head { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 10px 0 4px; }
  .type-group { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; padding: 6px 8px; }
  .type-group summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
  .type-item {
    display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left;
    border: 0; background: none; cursor: pointer; padding: 7px 8px; border-radius: 6px;
  }
  .type-item:hover { background: rgba(0,0,0,.06); }
  .ti-name { font-size: 13px; }
  .ti-sample { font-size: 11px; color: var(--muted); font-family: "Consolas", "Courier New", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .desk { background: var(--desk); overflow: auto; padding: 32px; min-width: 0; }
  .frame {
    margin: 0 auto; width: max-content; background: #fff; box-shadow: var(--shadow);
    position: relative;
  }

  /* ---- status bar ---- */
  .status {
    display: flex; align-items: center; gap: 12px; padding: 4px 10px;
    background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .zoom-controls { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; }
  .status-btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px;
    width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .status-btn#zoom-fit { width: auto; padding: 0 7px; font-size: 11px; }
  .status-input { width: 62px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 2px 4px; font-size: 12px; text-align: center; }
  #zoom-val { margin-left: auto; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

  /* ---- toast ---- */
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #111; color: #fff; padding: 9px 16px; border-radius: 8px;
    font-size: 13px; z-index: 2000; box-shadow: var(--shadow); max-width: 80vw;
  }

  /* ---- modal ---- */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1500;
    display: flex; align-items: center; justify-content: center; overflow: auto; padding: 20px;
  }
  .modal-card {
    background: var(--panel); color: var(--fg); border-radius: 10px; box-shadow: var(--shadow);
    padding: 18px; width: 380px; max-width: 100%; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); overflow: auto; margin: auto;
  }
  .modal-card h3 { margin: 0 0 12px; font-size: 15px; }
  .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .grad-preview { height: 38px; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: transparent; }
  .color-preview { height: 30px; border: 1px solid var(--line); border-radius: 8px; margin-top: 5px; background: #fff; }

  /* ---- responsive & touch ---- */
  button, .btn, .menu-btn, .rb-btn, .type-item, .tb-btn { touch-action: manipulation; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  @media (pointer: coarse) {
    .tb-btn { width: 42px; height: 42px; }
    .menu-btn { min-height: 40px; }
    .btn, .menu-item, .rb-btn, .type-item { min-height: 40px; }
    .layer-filter { min-height: 38px; }
    .input { min-height: 40px; }
    .rb-btn { min-width: 60px; }
  }

  @media (max-width: 1024px) {
    .work { grid-template-columns: 190px minmax(0, 1fr) 230px; }
    .desk { padding: 20px; }
    .tb-search input { width: 150px; }
    .rb-tabs { overflow-x: auto; }
    .rb-groups { flex-wrap: nowrap; overflow-x: auto; }
  }

  @media (max-width: 860px) {
    .only-mobile { display: grid; }
    .tb-search, .tb-name { display: none; }
    .work { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr); }
    .desk { padding: 12px; }
    .side {
      position: fixed; top: 0; bottom: 0; z-index: 900;
      width: min(320px, 86vw); max-height: none; padding: 12px;
      box-shadow: var(--shadow);
      transition: transform .22s ease;
    }

  function replaceImageObject(oldObj, newObj) {

  function objectBounds(o) {
    const b = o.getBoundingRect(false, true);
    return { left: b.left, top: b.top, right: b.left + b.width, bottom: b.top + b.height, cx: b.left + b.width / 2, cy: b.top + b.height / 2 };
  }
  function alignSelected(mode) {
    const objs = activeObjects();
    if (!objs.length) return;
    const bounds = objs.map(objectBounds);
    let box;
    if (objs.length === 1) {
      box = { left: 0, top: 0, right: px(doc.w), bottom: px(doc.h), cx: px(doc.w) / 2, cy: px(doc.h) / 2 };
    } else {
      box = {
        left: Math.min(...bounds.map((b) => b.left)),
        top: Math.min(...bounds.map((b) => b.top)),
        right: Math.max(...bounds.map((b) => b.right)),
        bottom: Math.max(...bounds.map((b) => b.bottom))
      };
      box.cx = (box.left + box.right) / 2;
      box.cy = (box.top + box.bottom) / 2;
    }
    objs.forEach((o, i) => {
      const b = bounds[i];
      if (mode === 'left') o.left += box.left - b.left;
      else if (mode === 'centerh') o.left += box.cx - b.cx;
      else if (mode === 'right') o.left += box.right - b.right;
      else if (mode === 'top') o.top += box.top - b.top;
      else if (mode === 'middle') o.top += box.cy - b.cy;
      else if (mode === 'bottom') o.top += box.bottom - b.bottom;
      o.setCoords();
    });
    canvas.requestRenderAll(); pushHistory(); markDirty(); renderProps();
  }
  function distributeSelected(axis) {
    const objs = activeObjects();
    if (objs.length < 3) { toast('Select at least three objects to distribute'); return; }
    if (axis === 'h') {
      objs.sort((a, b) => objectBounds(a).cx - objectBounds(b).cx);
      const first = objectBounds(objs[0]), last = objectBounds(objs[objs.length - 1]);
      const gap = (last.cx - first.cx) / (objs.length - 1);
      objs.forEach((o, i) => { if (i === 0 || i === objs.length - 1) return; o.left += (first.cx + gap * i) - objectBounds(o).cx; o.setCoords(); });
    } else {
      objs.sort((a, b) => objectBounds(a).cy - objectBounds(b).cy);
      const first = objectBounds(objs[0]), last = objectBounds(objs[objs.length - 1]);
      const gap = (last.cy - first.cy) / (objs.length - 1);
      objs.forEach((o, i) => { if (i === 0 || i === objs.length - 1) return; o.top += (first.cy + gap * i) - objectBounds(o).cy; o.setCoords(); });
    }
    canvas.requestRenderAll(); pushHistory(); markDirty(); renderProps();
  }

  function layerLabel(o) {

      + '<button class="layer-select" data-idx="' + idx + '"' + (isChild ? ' data-child="' + childIdx + '"' : '') + '>' + expander + '<span class="layer-title">' + svgIcon(layerIconFor(o)) + esc(layerLabel(o)) + '</span><span class="layer-meta">' + opacity + '%</span></button>'
      + '<button class="layer-icon' + (locked ? ' on' : '') + '" data-lock="' + idx + '"' + (isChild ? ' data-child="' + childIdx + '"' : '') + ' title="' + (locked ? 'Unlock layer' : 'Lock layer') + '">' + svgIcon(locked ? 'lock' : 'unlock') + '</button>'
      + '<input class="layer-opacity" data-opacity="' + idx + '"' + (isChild ? ' data-child="' + childIdx + '"' : '') + ' type="number" min="0" max="1" step="0.05" value="' + (o.opacity == null ? 1 : o.opacity) + '" title="Layer opacity">'

  function openLayerMenu(o, x, y) {

  function renderLayersPanel(right) {

    $('layers-add-shape').onclick = () => openShapeDialog('rectangle');
    $('layers-add-text').onclick = openTextDialog;
    $('layers-add-art').onclick = () => openArtworkDialog();

    $('layers-ungroup').onclick = ungroupSelection;
    $('layers-expand').onclick = () => { canvas.getObjects().filter((o) => o.kind === 'group' && o.getObjects).forEach((o) => expandedGroups.add(o)); renderProps(); };
    $('layers-collapse').onclick = () => { canvas.getObjects().filter((o) => o.kind === 'group' && o.getObjects).forEach((o) => expandedGroups.delete(o)); renderProps(); };
    $('layers-search').oninput = () => {
      layerSearch = $('layers-search').value;
      render();
    };
    $('layers-filter-bar').querySelectorAll('[data-layer-filter]').forEach((b) => {
      b.onclick = () => {
        layerFilter = b.dataset.layerFilter;
        $('layers-filter-bar').querySelectorAll('[data-layer-filter]').forEach((x) => {
          x.classList.toggle('active', x.dataset.layerFilter === layerFilter);
          x.setAttribute('aria-pressed', x.dataset.layerFilter === layerFilter ? 'true' : 'false');
        });
        render();
      };
    });
    const render = () => {
      const arr = canvas.getObjects();
      const q = layerSearch.trim().toLowerCase();
      const filtering = layerFilter !== 'all' || !!q;
      const topFirst = arr.slice().reverse().filter((o) => layerMatchesFilter(o, q));
      const list = $('layers-list');
      const resolveObject = (el) => {
        const top = canvas.getObjects()[+el.dataset.idx];
        if (!top) return null;
        if (el.dataset.child != null) {
          return top.getObjects ? top.getObjects()[+el.dataset.child] : null;
        }
        return top;
      };
      list.innerHTML = topFirst.map((o, displayIdx) => {
        const idx = arr.indexOf(o);
        const expanded = o.kind === 'group' && expandedGroups.has(o);
        const rows = [layerRowHTML(o, idx, displayIdx, null, expanded)];
        if (expanded && o.getObjects) {
          rows.push('<div class="layer-children">' + o.getObjects().map((child, childIdx) => layerRowHTML(child, idx, displayIdx, childIdx, false)).join('') + '</div>');
        }
        return '<div class="layer-node">' + rows.join('') + '</div>';
      }).join('') || '<p class="hint">No objects yet.</p>';
      const countEl = $('layers-count');
      if (countEl) countEl.textContent = topFirst.length + ' of ' + arr.length + ' layers' + (filtering ? ' shown' : '');
      const hintEl = $('layers-hint');
      if (hintEl) hintEl.textContent = filtering
        ? 'Filter or search is active. Reordering is paused; clear the filter to drag layers.'
        : 'Top layer is in front. Group sets expand to show their layers. Use the checkboxes to select multiple layers, then Group. Drag rows to reorder.';
      list.querySelectorAll('.layer-row').forEach((row) => {
        if (row.dataset.child == null) row.draggable = !filtering;
        row.addEventListener('contextmenu', (e) => {
          e.preventDefault();

        });
        row.addEventListener('dragstart', (e) => {
          if (row.dataset.child != null || filtering) return;

          row.classList.remove('dragging');
          list.querySelectorAll('.layer-row').forEach((r) => r.classList.remove('drop-before', 'drop-after'));
        });
        row.addEventListener('dragover', (e) => {
          if (row.dataset.child != null || filtering) return;
          e.preventDefault();
          const rect = row.getBoundingClientRect();
          const before = e.clientY < rect.top + rect.height / 2;
          list.querySelectorAll('.layer-row').forEach((r) => r.classList.remove('drop-before', 'drop-after'));
          row.classList.add(before ? 'drop-before' : 'drop-after');
        });
        row.addEventListener('drop', (e) => {
          if (row.dataset.child != null || filtering) return;
          e.preventDefault();
          const fromIdx = +e.dataTransfer.getData('text/plain');
          const targetDisplay = +row.dataset.display;
          const rect = row.getBoundingClientRect();
          const before = e.clientY < rect.top + rect.height / 2;
          const dropDisplay = before ? targetDisplay : targetDisplay + 1;
          list.querySelectorAll('.layer-row').forEach((r) => r.classList.remove('drop-before', 'drop-after', 'dragging'));
          reorderLayerToDisplay(fromIdx, dropDisplay);

        b.onclick = (e) => {
          const top = canvas.getObjects()[+b.dataset.idx];
          if (!top) return;
          if (b.dataset.child == null && e.detail === 2 && top.kind === 'group') {
            renameGroup(top);
            return;
          }
          if (b.dataset.child == null && e.target.closest('.layer-expander')) {
            if (top.kind === 'group') {
              if (expandedGroups.has(top)) expandedGroups.delete(top); else expandedGroups.add(top);
              render();
            }
            return;
          }
          const o = resolveObject(b);

          if (b.dataset.child != null) {
            canvas.setActiveObject(top);
            canvas.requestRenderAll(); render(); updateStatusBar();
            return;
          }
          if (e.ctrlKey || e.metaKey) toggleLayerSelection(o);

        };
      });
      list.querySelectorAll('[data-check]').forEach((b) => {
        b.onchange = () => { const o = canvas.getObjects()[+b.dataset.check]; if (o) toggleLayerSelection(o); };
      });
      list.querySelectorAll('[data-eye]').forEach((b) => {

  async function renderOff(dpi) {
    const scale = dpi / 300;
    const W = Math.round(px(doc.w) * scale), H = Math.round(px(doc.h) * scale);
    const off = new fabric.StaticCanvas(null, { width: W, height: H });
    for (const it of serialize().items) {
      try { off.add(await buildItem(it, scale)); } catch (e) {}
    }
    off.setBackgroundColor(doc.bg || '#ffffff', () => off.renderAll());
    off.renderAll();
    return off;
  }
  async function svgExport() {
    const W = Math.round(px(doc.w)), H = Math.round(px(doc.h));
    const off = new fabric.StaticCanvas(null, { width: W, height: H });
    for (const it of serialize().items) {
      try { off.add(await buildItem(it)); } catch (e) {}
    }
    off.setBackgroundColor(doc.bg || '#ffffff', () => off.renderAll());
    off.renderAll();
    let svg = off.toSVG();
    svg = svg.replace(/ width="[^"]*" height="[^"]*"/, ' width="' + doc.w + 'mm" height="' + doc.h + 'mm"');
    return svg;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQ = false;
    const s = String(text).replace(/\r\n?/g, '\n');
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (inQ) {
        if (ch === '"') { if (s[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += ch;
      } else if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(field.trim()); field = ''; }
      else if (ch === '\n') { row.push(field.trim()); field = ''; if (row.some((c) => c !== '')) rows.push(row); row = []; }
      else field += ch;
    }
    row.push(field.trim());
    if (row.some((c) => c !== '')) rows.push(row);
    return rows;
  }
  function csvLooksLikeHeader(row) {
    if (!row || row.length < 2) return false;
    const words = row.filter((c) => /[A-Za-z]/.test(c)).length;
    return words >= Math.max(1, Math.ceil(row.length / 2));
  }
  function openCSV() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.csv,text/csv,text/plain';

        const width = Math.max(...rows.map((r) => r.length));
        const padded = rows.map((r) => { const a = r.slice(); while (a.length < width) a.push(''); return a; });

        const build = (useHeader) => {
          const data = useHeader ? padded.slice(1) : padded;
          const names = Array.from({ length: width }, (_, idx) => (useHeader && padded[0][idx] ? padded[0][idx] : ('Column ' + (idx + 1))));
          const prevType = $('csv-type') ? $('csv-type').value : null;
          const prevMode = $('csv-mode') ? $('csv-mode').value : 'single';
          const typeOptions = BARCODE_TYPES.map((t) => '<option value="' + t.id + '">' + t.name + '</option>').join('');
          const colOptions = names.map((n, idx) => '<option value="' + idx + '">' + esc(n) + '</option>').join('');
          const checkOptions = names.map((n, idx) => '<label class="check"><input type="checkbox" id="csv-c' + idx + '"' + (idx === 0 ? ' checked' : '') + '> <span>' + esc(n) + '</span></label>').join('');
          openModal('<h3>Import CSV barcode data</h3>'
            + '<p class="hint">' + data.length + ' data rows, ' + width + ' columns.</p>'
            + '<label class="field"><span>Barcode type</span><select id="csv-type" class="input">' + typeOptions + '</select></label>'
            + '<label class="check"><input type="checkbox" id="csv-header"' + (useHeader ? ' checked' : '') + '> <span>First row is a header</span></label>'
            + '<label class="field"><span>Barcode value</span><select id="csv-mode" class="input"><option value="single">Use one column</option><option value="combine">Combine several columns</option></select></label>'
            + '<div id="csv-single"><label class="field"><span>Column</span><select id="csv-col" class="input">' + colOptions + '</select></label></div>'
            + '<div id="csv-combine" style="display:none"><label class="field"><span>Columns to include (in column order)</span></label>'
            + '<div style="max-height:160px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:2px 8px">' + checkOptions + '</div>'
            + '<label class="field"><span>Separator</span><input id="csv-sep" class="input" value=" | "></label></div>'
            + '<div class="hint" id="csv-preview"></div>'
            + '<div class="modal-btns"><button class="btn" id="csv-cancel">Cancel</button><button class="btn primary" id="csv-go">Import</button></div>');
          if (prevType && $('csv-type')) $('csv-type').value = prevType;
          if (prevMode) $('csv-mode').value = prevMode;

          const refresh = () => {
            const mode = $('csv-mode').value;
            $('csv-single').style.display = mode === 'single' ? '' : 'none';
            $('csv-combine').style.display = mode === 'combine' ? '' : 'none';
            let vals;
            if (mode === 'single') {
              const col = +$('csv-col').value || 0;
              vals = data.map((r) => r[col]).filter((v) => v !== '');
            } else {
              const sep = $('csv-sep').value;
              const cols = Array.from({ length: width }, (_, idx) => ($('csv-c' + idx) && $('csv-c' + idx).checked ? idx : -1)).filter((x) => x >= 0);
              vals = data.map((r) => cols.map((c) => r[c]).filter((v) => v !== '').join(sep)).filter((v) => v !== '');
            }
            const preview = vals.slice(0, 3).map((v) => esc(v.length > 40 ? v.slice(0, 40) + '…' : v)).join('<br>');
            $('csv-preview').innerHTML = vals.length ? (vals.length + ' barcode values. Preview:<br>' + preview) : 'No values for this selection.';
            return vals;
          };

          $('csv-mode').onchange = refresh;
          $('csv-col').onchange = refresh;
          $('csv-sep').oninput = refresh;
          for (let idx = 0; idx < width; idx++) if ($('csv-c' + idx)) $('csv-c' + idx).onchange = refresh;
          $('csv-header').onchange = () => build($('csv-header').checked);
          $('csv-cancel').onclick = closeModal;
          $('csv-go').onclick = () => {
            const type = $('csv-type').value;
            const vals = refresh().slice(0, 200);
            closeModal();
            if (!vals.length) { toast('No barcode values to import'); return; }
            generateFromValues(type, vals);
          };
          refresh();
        };
        build(csvLooksLikeHeader(padded[0]));
      };
      r.readAsText(f);
    };
    i.click();
  }

  async function generateFromValues(type, values) {
    const def = BARCODE_TYPES.find((t) => t.id === type) || BARCODE_TYPES[0];
    const base = defaultBarcode(def);
    const gap = Math.max(4, doc.h * 0.05);
    const needed = gap + (base.hmm + gap) * values.length;
    if (needed > doc.h) doc = { ...doc, h: Math.min(2000, Math.ceil(needed)) };
    canvas.clear(); applyDoc();
    let y = gap;
    for (let i = 0; i < values.length; i++) {
      const bc = { ...base, value: values[i], wmm: Math.min(base.wmm, doc.w * 0.85) };
      try {
        const g = await buildBarcode(bc);
        g.set({ left: px(doc.w) / 2, top: y + px(bc.hmm) / 2, originX: 'center', originY: 'center' });
        g.setCoords(); canvas.add(g);
        y += px(bc.hmm) + px(gap);
      } catch (e) { toast(e.message); break; }
    }
    canvas.discardActiveObject(); canvas.renderAll(); fitZoom(); pushHistory(); markDirty(); renderProps(); toast('Imported ' + values.length + ' barcodes');
  }

  let openMenu = null;
  function closeMenus() { if (openMenu) { openMenu.list.remove(); openMenu = null; } }
  function openList(items, anchor) {
    closeMenus();
    const list = document.createElement('div'); list.className = 'menu-list'; list.setAttribute('role', 'menu');
    items.forEach((it) => {
      if (it === '-') { const s = document.createElement('div'); s.className = 'menu-sep'; list.append(s); return; }
      if (it.heading) { const h = document.createElement('div'); h.className = 'menu-heading'; h.textContent = it.heading; list.append(h); return; }
      const b = document.createElement('button'); b.className = 'menu-item';
      const isCheck = it.checked != null;
      b.innerHTML = '<span class="menu-check">' + (isCheck && it.checked() ? '✓' : '') + '</span><span>' + it.label + '</span><span class="menu-key">' + (it.key || '') + '</span>';
      b.disabled = !!(it.disabled && it.disabled());
      b.onclick = () => { closeMenus(); it.run && it.run(); };
      list.append(b);
    });
    document.body.append(list);
    const r = anchor.getBoundingClientRect();
    list.style.top = (r.bottom + 4) + 'px';
    list.style.left = Math.min(r.left, window.innerWidth - 240) + 'px';
    openMenu = { list };
  }
  document.addEventListener('mousedown', (e) => { if (openMenu && !openMenu.list.contains(e.target)) closeMenus(); });

          item('Zoom out', () => { autoFit = false; setZoom(zoom / 1.25); }, { key: '−' }),
          item('Fit to window', () => { autoFit = true; fitZoom(); }, { key: '0' }),
          item('Actual size (100%)', () => { autoFit = false; setZoom(96 / DPI); })
        ])]],
        ['Theme', [drop('Theme', I.sun, [
          item('Match system', () => setTheme('system'), { checked: () => getTheme() === 'system' }),
          item('Light', () => setTheme('light'), { checked: () => getTheme() === 'light' }),
          item('Dark', () => setTheme('dark'), { checked: () => getTheme() === 'dark' })
        ])]]
      ] },
      { id: 'output', label: 'Output', hue: '#7b4fd6', groups: [
        ['Export', [drop('Export', I.export, [
          item('PNG…', () => exportImage('png', 300)),
          item('JPG…', () => exportImage('jpg', 300)),
          item('SVG…', () => exportImage('svg', 300)),
          item('Export options…', openExport, { key: 'Ctrl+E' }),
          item('Copy PNG to clipboard', copyPng),
          item('Print…', print, { key: 'Ctrl+P' })
        ])]],
        ['File', [drop('File', I.save, [
          item('Save', () => save(false), { key: 'Ctrl+S' }),
          item('Save as…', () => save(true), { key: 'Ctrl+Shift+S' }),
          item('Open…', openFile, { key: 'Ctrl+O' }),
          item('Clear canvas', clearDoc)
        ])]]
      ] }
    ];
    const tabsEl = $('rb-tabs'), groupsEl = $('rb-groups');
    function show(t) {
      groupsEl.innerHTML = '';
      tabsEl.querySelectorAll('.rb-tab').forEach((b) => b.classList.toggle('active', b === t.btn));
      const quick = document.createElement('div'); quick.className = 'rb-group rb-quick-group';
      const qn = document.createElement('div'); qn.className = 'rb-gname'; qn.textContent = 'Quick'; quick.append(qn);
      const qrow = document.createElement('div'); qrow.className = 'rb-btns'; quickControls.forEach((b) => qrow.append(b)); quick.append(qrow);
      groupsEl.append(quick);
      t.groups.forEach(([name, controls]) => {
        const g = document.createElement('div'); g.className = 'rb-group';
        const n = document.createElement('div'); n.className = 'rb-gname'; n.textContent = name; g.append(n);
        const row = document.createElement('div'); row.className = 'rb-btns'; controls.forEach((b) => row.append(b)); g.append(row);
        groupsEl.append(g);
      });
    }
    tabs.forEach((t) => { const b = document.createElement('button'); b.className = 'rb-tab'; b.textContent = t.label; b.style.setProperty('--tab-hue', t.hue); b.onclick = () => show(t); t.btn = b; tabsEl.append(b); });
    show(tabs[0]);
  }

  async function toggleShowText() { const o = activeBarcode(); if (!o) return; await replaceBarcode(o, { ...o.bc, showText: !o.bc.showText }); }
  async function toggleInvert() {
    const o = activeBarcode(); if (!o) return;
    const oldFg = o.bc.fg || '#000000';
    const newFg = oldFg === '#000000' ? '#ffffff' : '#000000';
    const nb = { ...o.bc, fg: newFg };
    if (!o.bc.textColor || o.bc.textColor === oldFg) nb.textColor = newFg;
    await replaceBarcode(o, nb);
  }
  async function cutSel() { copySel(); removeActive(); }

  // ---- search (Alt+Q) ----
  const allCommands = () => { const out = []; menus.forEach(([, items]) => items.forEach((it) => { if (it && it.run) out.push(it); })); return out; };
  function showSearch(q) {
    closeMenus();
    if (!q) return;
    const m = allCommands().filter((it) => it.label.toLowerCase().includes(q.toLowerCase())).slice(0, 15);
    openList(m, $('tb-search'));
  }

  // ---- export dialog ----
  function openExport() {
    openModal('<h3>Export image</h3>'
      + '<label class="field"><span>Format</span><select id="ex-fmt" class="input"><option value="png">PNG</option><option value="jpg">JPG</option><option value="svg">SVG</option></select></label>'
      + '<label class="field"><span>Resolution</span><select id="ex-dpi" class="input"><option value="203">203 DPI (label printers)</option><option value="300" selected>300 DPI</option><option value="600">600 DPI</option></select></label>'
      + '<div class="modal-btns"><button class="btn" id="ex-cancel">Cancel</button><button class="btn primary" id="ex-go">Export</button></div>');
    $('ex-cancel').onclick = closeModal;
    $('ex-go').onclick = () => { const fmt = $('ex-fmt').value, dpi = +$('ex-dpi').value; closeModal(); exportImage(fmt, dpi); };
  }

  // ---- modal + toast ----
  function openModal(html) { closeModal(); const ov = document.createElement('div'); ov.className = 'modal'; ov.innerHTML = '<div class="modal-card">' + html + '</div>'; ov.addEventListener('mousedown', (e) => { if (e.target === ov) closeModal(); }); document.body.append(ov); return ov; }
  function closeModal() { const m = document.querySelector('.modal'); if (m) m.remove(); }
  let toastT = null;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000); }
  function about() {
    openModal('<h3>About BarCraft</h3><p class="hint">BarCraft is a browser barcode maker with the same look and feel as your other Craft tools. It includes the full supported set of bwip-js symbologies: linear barcodes, GS1, 2D / QR, postal barcodes and HIBC variants.</p><p class="hint">2D codes support standard data formats: web addresses, email, phone, text messages, Wi-Fi, contact cards (vCard) and map locations. Postal, EAN/UPC, ISBN, GS1 and HIBC codes show their required formats right in the panel.</p><p class="hint">You can also draw rectangles, squares, circles and hexagons, import SVG/PNG/JPG/WebP/GIF/BMP artwork or ClipArtCraft image links, rotate by any angle, flip, invert colours, reorder layers, and choose black or white (or any colour) page backgrounds.</p><p class="hint">Barcodes are drawn as exact vector bars, exported at 203 / 300 / 600 DPI as PNG, JPG or SVG. Pick Dymo, Brother, Zebra and Avery label stock (or any custom size in mm or inches), import CSV address lists and choose which columns to encode, and print at real size. Everything runs offline from this folder.</p><div class="modal-btns"><button class="btn primary" id="ab-close">Close</button></div>');
    $('ab-close').onclick = closeModal;
  }

  function updateTitle() { const n = $('tb-name'); if (n) n.textContent = (dirty ? '● ' : '') + docName; }

  // ---- events ----
  canvas.on('selection:created', () => { if (!busy) renderProps(); });
  canvas.on('selection:updated', () => { if (!busy) renderProps(); });
  canvas.on('selection:cleared', () => { if (!busy) renderProps(); });
  canvas.on('object:modified', (e) => {
    if (!e.target) return;
    const action = (e.transform && e.transform.action) || e.action || '';
    const scaled = action === 'scale' || action === 'scaleX' || action === 'scaleY';
    if (e.target.kind === 'barcode' && scaled) resizeBarcode(e.target);
    else { pushHistory(); markDirty(); renderProps(); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.altKey && e.key.toLowerCase() === 'q') { e.preventDefault(); $('tb-search').focus(); return; }
    if (openMenu && e.key === 'Escape') { closeMenus(); return; }
    if (document.querySelector('.modal')) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || (active() && active().isEditing);
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (mod && k === 's') { e.preventDefault(); save(e.shiftKey); return; }
    if (mod && k === 'o') { e.preventDefault(); openFile(); return; }
    if (mod && k === 'e') { e.preventDefault(); openExport(); return; }
    if (mod && k === 'p') { e.preventDefault(); print(); return; }
    if (typing) return;
    if (mod && k === 'a') { e.preventDefault(); selectAll(); return; }
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (mod && k === 'c') { e.preventDefault(); copySel(); return; }
    if (mod && k === 'x') { e.preventDefault(); cutSel(); return; }
    if (mod && e.shiftKey && k === 'v') { e.preventDefault(); pasteTextRows(); return; }
    if (mod && k === 'v') { e.preventDefault(); paste(); return; }
    if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
    if (mod && e.shiftKey && k === 'g') { e.preventDefault(); ungroupSelection(); return; }
    if (mod && k === 'g') { e.preventDefault(); groupSelection(); return; }
    if (mod) {
      if (e.shiftKey && k === '[') { e.preventDefault(); layerSelected('backmost'); return; }
      if (e.shiftKey && k === ']') { e.preventDefault(); layerSelected('front'); return; }
      if (k === '[') { e.preventDefault(); layerSelected('back'); return; }
      if (k === ']') { e.preventDefault(); layerSelected('forward'); return; }
      return;
    }
    if (k === 'delete' || k === 'backspace') { e.preventDefault(); removeActive(); return; }
    const step = e.shiftKey ? 5 : 0.5;
    const arrows = { arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step] };
    if (arrows[k] && activeObjects().length) { e.preventDefault(); moveActive(arrows[k][0], arrows[k][1]); }
    if (k === '[') { e.preventDefault(); layerSelected('back'); return; }
    if (k === ']') { e.preventDefault(); layerSelected('forward'); return; }
    if (k === '{') { e.preventDefault(); layerSelected('backmost'); return; }
    if (k === '}') { e.preventDefault(); layerSelected('front'); return; }
    if (k === 'h') { e.preventDefault(); flipSelected('h'); return; }
    if (k === 'v') { e.preventDefault(); flipSelected('v'); return; }
    if (k === 'i') { e.preventDefault(); invertSelection(); return; }
    if (k === 'r') { e.preventDefault(); if (activeObjects().length) openRotateDialog(); return; }
    if (k === '+' || k === '=') { autoFit = false; setZoom(zoom * 1.25); }
    if (k === '-' || k === '_') { autoFit = false; setZoom(zoom / 1.25); }
    if (k === '0') { autoFit = true; fitZoom(); }
    if (k === 'escape') { canvas.discardActiveObject(); canvas.requestRenderAll(); renderProps(); }
  });

  $('tb-search').addEventListener('input', (e) => showSearch(e.target.value));
  $('tb-theme').onclick = openThemeMenu;
  $('tb-logo').onclick = about;
  document.querySelectorAll('.right-tab').forEach((b) => { b.onclick = () => switchRightTab(b.dataset.tab); });
  $('zoom-out').onclick = () => { autoFit = false; setZoom(zoom / 1.25); };
  $('zoom-in').onclick = () => { autoFit = false; setZoom(zoom * 1.25); };
  $('zoom-fit').onclick = () => { autoFit = true; fitZoom(); };
  $('zoom-input').onchange = () => { autoFit = false; setZoom((+$('zoom-input').value || 100) / 100 * 96 / DPI); };
  $('series-btn').onclick = openSeries;
  $('csv-btn').onclick = openCSV;
  $('paste-rows-btn').onclick = pasteTextRows;
  $('type-search').addEventListener('input', renderTypeList);
  $('doc-new-btn').onclick = newDoc;
  $('doc-open-btn').onclick = openFile;
  $('doc-reopen-btn').onclick = reopenLast;
  $('doc-clear-btn').onclick = clearDoc;
  $('doc-stock-btn').onclick = openLabelStock;
  $('left-shape-btn').onclick = () => openShapeDialog('rectangle');
  $('left-text-btn').onclick = openTextDialog;
  $('left-dingbat-btn').onclick = openDingbatDialog;
  $('left-art-btn').onclick = () => openArtworkDialog();
  $('left-fill-btn').onclick = openFillPageDialog;
  $('left-layers-btn').onclick = openLayers;
  function closePanels() { $('left').classList.remove('open'); $('right').classList.remove('open'); $('scrim').hidden = true; }
  function togglePanel(side) {
    const el = side === 'left' ? $('left') : $('right');
    const other = side === 'left' ? $('right') : $('left');
    const open = !el.classList.contains('open');
    el.classList.toggle('open', open);
    other.classList.remove('open');
    $('scrim').hidden = !open;
  }
  $('tb-types').onclick = () => togglePanel('left');
  $('tb-options').onclick = () => togglePanel('right');
  $('scrim').onclick = closePanels;
  $('desk').addEventListener('click', closePanels);
  document.addEventListener('click', (e) => { if (e.target.classList && e.target.classList.contains('panel-close')) closePanels(); });

  // Small non-visual test/debug bridge for automated validation.
  window.__barcraftTest = {
    get canvas() { return canvas; },
    get doc() { return doc; },
    px,
    createShapeObject,
    fitAndAddObject,
    selectAll,
    groupSelection,
    ungroupSelection,
    renameGroup,
    serialize,
    deserialize,
    activeObjects
  };

  // ---- init ----
  decorateIconButtons();
  applyTheme();
  applyDoc();
  buildMenus();
  buildQuick();
  buildRibbon();
  renderTypeList();
  const hadAutosave = await restoreAutosave();
  if (!hadAutosave) {
    addBarcode('CODE128');
    resetHistory();
    dirty = false; updateTitle();
  }
  fitZoom();
})();
</script>
</body>
</html>
