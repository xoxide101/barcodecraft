<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BarcodeCraft</title>
<style>
  :root { --bg: #15161b; --panel: #1f2129; --panel-2: #2a2d38; --line: #3a3e4c; --text: #e8e9ee; --fg: #e8e9ee; --dim: #9aa0b0; --muted: #9aa0b0; --accent: #d99a00; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  main { flex: 1; padding: 14px 18px 40px; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
  .bar .grow { flex: 1; }
  input, select, textarea { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); color: inherit; font: inherit; }
  textarea { width: 100%; font-family: Consolas, "Courier New", monospace; }
  button { padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); color: inherit; font: inherit; cursor: pointer; }
  button.main { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .dim { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .tile.on { outline: 2px solid var(--accent); }
  .tile .pic { background: #fff; border-radius: 6px; height: 120px; display: grid; place-items: center; padding: 6px; }
  .tile .pic img { max-width: 100%; max-height: 108px; }
  .tile .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .ty { font-size: 12px; color: var(--dim); }
  .tile .acts { display: flex; gap: 4px; flex-wrap: wrap; } .tile .acts button { padding: 2px 7px; font-size: 12px; }
  .tile .bad { color: #f87171; font-size: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; }
  .two { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1.4fr); gap: 14px; } @media (max-width: 800px) { .two { grid-template-columns: 1fr; } }
  label.f { display: inline-grid; gap: 2px; font-size: 12.5px; color: var(--dim); } label.f > * { color: var(--text); }
  .sheetprev { background: #777; padding: 14px; border-radius: 10px; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .sheetprev .page { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.35); }
  .empty { padding: 30px; text-align: center; color: var(--dim); border: 1px dashed var(--line); border-radius: 10px; }
  #print-area { display: none; }
  @media print {
    body { background: #fff; }
    #app { display: none !important; }
    #print-area { display: block !important; }
    #print-area .page { page-break-after: always; break-after: page; }
    #print-area .page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<div id="print-area"></div>
<script src="lib/bwip-js-min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="js/craft-crypto.js"></script>
<script src="js/craft-account.js"></script>
<script src="js/craft-rail.js"></script>
<script src="js/craft-barcode.js"></script>
<script src="js/craft-titlebar.js"></script>
<script>
/* BarcodeCraft: the barcode library, many at once, and sheets of barcodes to print, all with the barcode core
   (js/craft-barcode.js) that every Craft app carries. The canvas editor is designer.html (Sheet designer). */
(function () {
  'use strict';
  const B = window.CraftBarcode, I = window.CraftIcons || {}, $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const svgUrl = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const KEY = 'barcodecraft';
  const LOGO = '<svg viewBox="0 0 64 64" width="26" height="26"><rect width="64" height="64" rx="12" fill="#f2b400"/><g fill="#20232a"><rect x="12" y="16" width="3" height="32"/><rect x="19" y="16" width="1.6" height="32"/><rect x="25" y="16" width="4.2" height="32"/><rect x="33" y="16" width="1.6" height="32"/><rect x="38" y="16" width="3" height="32"/><rect x="45" y="16" width="5" height="32"/></g></svg>';
  const pref = (() => { try { return JSON.parse(localStorage.getItem(KEY + '-prefs')) || {}; } catch (e) { return {}; } })();
  const keepPref = () => { try { localStorage.setItem(KEY + '-prefs', JSON.stringify(pref)); } catch (e) { /* blocked */ } };
  let view = pref.view || 'library', chosen = new Set(), many = [], find = '', ribbon = null, tb = null;
  let toastT; function toast(t) { let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;z-index:10001;box-shadow:0 4px 20px rgba(0,0,0,.4)'; document.body.append(el); } el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3500); }
  function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  const safeName = (s) => String(s || 'barcode').replace(/[\\/:*?"<>|\r\n]+/g, ' ').trim().slice(0, 80) || 'barcode';
  const made = (e) => { try { return B.make(e); } catch (x) { return { error: x.message }; } };
  const typeName = (id) => (B.TYPES.find((t) => t.id === id) || {}).name || id;

  // ------------------------------------------------------------------ actions
  const firstLine = (m) => (String(m.value).split(/\r?\n/).find((l) => /^FN:/.test(l)) || '').slice(3) || String(m.value).split(/\r?\n/)[0].slice(0, 40);
  function newOne() { B.open({ app: 'BarcodeCraft', title: 'A new barcode', insertLabel: 'Save to the library', onInsert: (m) => { const name = prompt('A name for it:', firstLine(m)); if (name == null) return; B.save({ ...m, name: name.trim() || m.value }); toast('Saved to the library.'); go('library'); } }); }
  function edit(e) { B.open({ app: 'BarcodeCraft', title: 'Change this barcode', entry: e, insertLabel: 'Save', onInsert: (m) => { B.save({ ...m, id: e.id, name: e.name }); toast('Saved.'); draw(); } }); }
  async function savePng(e, dpi = pref.dpi || 300) { const m = made(e); if (m.error) return toast(m.error); download(await B.png(m, dpi), `${safeName(e.name)}.png`); }
  function saveSvg(e) { const m = made(e); if (m.error) return toast(m.error); download(new Blob([m.svg], { type: 'image/svg+xml' }), `${safeName(e.name)}.svg`); }
  async function copyPic(e) {
    const m = made(e); if (m.error) return toast(m.error);
    if (!navigator.clipboard || !window.ClipboardItem || !window.isSecureContext) return toast('Copying a picture needs https or this computer’s own address: use PNG instead.');
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': await B.png(m, pref.dpi || 300) })]); toast('Copied: paste it into any app.'); } catch (x) { toast('The browser did not allow copying here.'); }
  }
  function removeChosen(list) { if (!list.length) return; if (!confirm(`Delete ${list.length === 1 ? `“${list[0].name}”` : list.length + ' barcodes'} from the library? This cannot be undone.`)) return; list.forEach((e) => B.remove(e.id)); list.forEach((e) => chosen.delete(e.id)); draw(); }
  function exportLib() { download(new Blob([JSON.stringify({ app: 'BarcodeCraft', kind: 'barcodes', version: 1, saved: new Date().toISOString(), barcodes: B.library() }, null, 1)], { type: 'application/json' }), 'barcodes.barcodecraft.json'); }
  function importLib() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => { const f = i.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()), list = Array.isArray(j) ? j : j.barcodes || []; let n = 0; list.forEach((e) => { if (e && e.type && e.value != null) { B.save(e); n++; } }); toast(`${n} barcode${n === 1 ? '' : 's'} added to the library.`); draw(); } catch (x) { toast('That is not a BarcodeCraft library file.'); } };
    i.click();
  }
  function go(v) { view = v; pref.view = v; keepPref(); draw(); }

  // ------------------------------------------------------------------ the library
  function library(main) {
    const all = B.library(), list = find ? all.filter((e) => (e.name + ' ' + e.value + ' ' + typeName(e.type)).toLowerCase().includes(find.toLowerCase())) : all;
    main.innerHTML = `<h1>Barcode library</h1><div class="bar"><input id="find" placeholder="Find a barcode…" value="${esc(find)}" style="min-width:220px"><span class="dim">${all.length} saved${window.CraftAccount && CraftAccount.user() ? ' · in your account too' : ' · in this browser (log in to keep them in your account)'}${chosen.size ? ` · ${chosen.size} chosen` : ''}</span><span class="grow"></span><button id="bnew" class="main">New barcode…</button></div>
      ${list.length ? '<div class="grid" id="grid"></div>' : `<div class="empty">${all.length ? 'Nothing matches.' : 'No barcodes yet. <b>New barcode…</b> makes one; <b>Make many</b> makes a whole list at once. Every Craft app’s Insert › Barcode shows them.'}</div>`}`;
    $('#find').oninput = (e) => { find = e.target.value; const pos = e.target.selectionStart; library(main); const f = $('#find'); f.focus(); f.setSelectionRange(pos, pos); };
    $('#bnew').onclick = newOne;
    const grid = $('#grid'); if (!grid) return;
    list.forEach((e) => {
      const m = made(e), t = document.createElement('div'); t.className = 'tile' + (chosen.has(e.id) ? ' on' : ''); t.title = e.value;
      t.innerHTML = `<div class="pic">${m.error ? `<span class="bad">${esc(m.error)}</span>` : `<img alt="" src="${svgUrl(m.svg)}">`}</div><div class="nm">${esc(e.name)}</div><div class="ty">${esc(typeName(e.type))} · ${m.wmm || e.wmm} × ${m.hmm || e.hmm} mm</div>
        <div class="acts"><button data-a="edit">Change</button><button data-a="png">PNG</button><button data-a="svg">SVG</button><button data-a="copy">Copy</button><button data-a="del" title="Delete">✕</button></div>`;
      t.addEventListener('click', (ev) => {
        const a = ev.target.closest('[data-a]');
        if (!a) { if (chosen.has(e.id)) chosen.delete(e.id); else chosen.add(e.id); t.classList.toggle('on'); return; }
        ({ edit: () => edit(e), png: () => savePng(e), svg: () => saveSvg(e), copy: () => copyPic(e), del: () => removeChosen([e]) })[a.dataset.a]();
      });
      t.addEventListener('dblclick', (ev) => { if (!ev.target.closest('[data-a]')) edit(e); });
      grid.append(t);
    });
  }

  // ------------------------------------------------------------------ many at once
  function parseMany(text) {
    return text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean).map((l) => { const m = l.match(/^([^\t,]+)[\t,](.+)$/); return pref.named && m ? { name: m[1].trim(), value: m[2].trim() } : { name: l.slice(0, 40), value: l }; });
  }
  function manyView(main) {
    const types = [...new Set(B.TYPES.map((t) => t.group))].map((g) => `<optgroup label="${esc(g)}">${B.TYPES.filter((t) => t.group === g).map((t) => `<option value="${t.id}"${t.id === (pref.mType || 'CODE128') ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('');
    main.innerHTML = `<h1>Make many</h1><div class="two"><div class="card">
        <p class="dim" style="margin-top:0">One barcode a line: paste a column from a spreadsheet, a list of numbers, links… Tick “Each line is name, value” to give each one a name (a comma or a tab between).</p>
        <textarea id="mtext" rows="14" spellcheck="false" placeholder="ABC-1001&#10;ABC-1002&#10;ABC-1003">${esc(pref.mText || '')}</textarea>
        <div class="bar" style="margin-top:8px"><label class="f">Kind<select id="mtype">${types}</select></label>
          <label class="f">Width mm<input id="mw" type="number" value="${pref.mW || 50}" style="width:80px"></label><label class="f">Height mm<input id="mh" type="number" value="${pref.mH || 20}" style="width:80px"></label>
          <label class="f" style="align-self:end"><span><input id="mtext2" type="checkbox"${pref.mShowText !== false ? ' checked' : ''}> Text under the bars</span></label>
          <label class="f" style="align-self:end"><span><input id="mnamed" type="checkbox"${pref.named ? ' checked' : ''}> Each line is name, value</span></label></div>
        <div class="bar"><button id="msave" class="main">Save all to the library</button><button id="msheet">Print them as a sheet…</button><span id="mcount" class="dim"></span></div>
      </div><div><div class="grid" id="mgrid"></div></div></div>`;
    const read = () => { pref.mText = $('#mtext').value; pref.mType = $('#mtype').value; pref.mW = +$('#mw').value || 50; pref.mH = +$('#mh').value || 20; pref.mShowText = $('#mtext2').checked; pref.named = $('#mnamed').checked; keepPref();
      many = parseMany(pref.mText).map((x) => ({ ...x, type: pref.mType, wmm: pref.mW, hmm: pref.mH, text: pref.mShowText })); };
    let t = 0; const show = () => { clearTimeout(t); t = setTimeout(() => { read(); const g = $('#mgrid'); g.innerHTML = ''; let bad = 0;
      many.forEach((e, i) => { const m = made(e); if (m.error) bad++; if (i >= 120) return; const d = document.createElement('div'); d.className = 'tile'; d.innerHTML = `<div class="pic">${m.error ? `<span class="bad">${esc(m.error)}</span>` : `<img alt="" src="${svgUrl(m.svg)}">`}</div><div class="nm">${esc(e.name)}</div>`; g.append(d); });
      $('#mcount').textContent = `${many.length} line${many.length === 1 ? '' : 's'}${bad ? ` · ${bad} cannot be made (see red)` : ''}${many.length > 120 ? ' · first 120 shown' : ''}`; }, 250); };
    main.querySelectorAll('input, select, textarea').forEach((x) => x.addEventListener('input', show));
    $('#msave').onclick = () => { read(); let ok = 0; many.forEach((e) => { const m = made(e); if (!m.error) { B.save({ ...m, name: e.name }); ok++; } }); toast(`${ok} saved to the library${ok < many.length ? ` (${many.length - ok} could not be made)` : ''}.`); };
    $('#msheet').onclick = () => { read(); pref.sheetFrom = 'many'; keepPref(); go('sheet'); };
    show();
  }

  // ------------------------------------------------------------------ sheets: a grid of barcodes on paper
  const PAPERS = { letter: [215.9, 279.4, 'Letter 8.5 × 11 in'], legal: [215.9, 355.6, 'Legal 8.5 × 14 in'], a4: [210, 297, 'A4'], tabloid: [279.4, 431.8, 'Tabloid 11 × 17 in'] };
  function sheetList() {
    const lib = B.library();
    if (pref.sheetFrom === 'many') return many.length ? many : parseMany(pref.mText || '').map((x) => ({ ...x, type: pref.mType || 'CODE128', wmm: pref.mW || 50, hmm: pref.mH || 20, text: pref.mShowText !== false }));
    if (pref.sheetFrom === 'chosen') return lib.filter((e) => chosen.has(e.id));
    return lib;
  }
  // the pages as SVG in millimetres: cells across × down, each code fitted in its cell (kept to its shape), its name under it
  function sheetPages() {
    const [pw, ph] = PAPERS[pref.paper || 'letter'], cols = Math.max(1, +pref.cols || 3), rows = Math.max(1, +pref.rows || 8), mg = pref.margin == null ? 10 : +pref.margin, gap = pref.gap == null ? 3 : +pref.gap, names = pref.names !== false, copies = Math.max(1, +pref.copies || 1);
    const list = sheetList().flatMap((e) => Array(copies).fill(e)), per = cols * rows, cw = (pw - 2 * mg - (cols - 1) * gap) / cols, ch = (ph - 2 * mg - (rows - 1) * gap) / rows, pages = [];
    for (let p = 0; p < Math.max(1, Math.ceil(list.length / per)); p++) {
      let body = '';
      list.slice(p * per, (p + 1) * per).forEach((e, i) => {
        const m = made(e), x = mg + (i % cols) * (cw + gap), y = mg + Math.floor(i / cols) * (ch + gap), nameH = names ? Math.min(4.5, ch * 0.22) : 0;
        if (pref.outline) body += `<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="none" stroke="#bbb" stroke-width="0.2" stroke-dasharray="1 1"/>`;
        if (m.error) { body += `<text x="${x + 2}" y="${y + 5}" font-size="3" fill="#c00">${esc(m.error)}</text>`; return; }
        const k = Math.min((cw - 2) / m.wmm, (ch - nameH - 2) / m.hmm), w = m.wmm * k, hh = m.hmm * k, bx = x + (cw - w) / 2, by = y + (ch - nameH - hh) / 2;
        body += `<image x="${bx}" y="${by}" width="${w}" height="${hh}" href="${svgUrl(m.svg)}"/>`;
        if (names) body += `<text x="${x + cw / 2}" y="${y + ch - nameH * 0.25}" font-family="Arial, sans-serif" font-size="${nameH * 0.7}" text-anchor="middle" fill="#000">${esc(e.name || '')}</text>`;
      });
      pages.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${pw}mm" height="${ph}mm" viewBox="0 0 ${pw} ${ph}"><rect width="${pw}" height="${ph}" fill="#fff"/>${body}</svg>`);
    }
    return { pages, n: list.length, per, pw, ph };
  }
  function sheetView(main) {
    const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${v}"${String(cur) === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    main.innerHTML = `<h1>Print a sheet</h1><div class="two"><div class="card">
        <div class="bar"><label class="f">Which barcodes${sel('sfrom', [['all', `The whole library (${B.library().length})`], ['chosen', `Chosen in the library (${chosen.size})`], ['many', 'The list in Make many']], pref.sheetFrom || 'all')}</label><label class="f">Copies of each<input id="scopies" type="number" min="1" max="999" value="${pref.copies || 1}" style="width:70px"></label></div>
        <div class="bar"><label class="f">Paper${sel('spaper', Object.entries(PAPERS).map(([k, v]) => [k, v[2]]), pref.paper || 'letter')}</label><label class="f">Across<input id="scols" type="number" min="1" max="20" value="${pref.cols || 3}" style="width:64px"></label><label class="f">Down<input id="srows" type="number" min="1" max="40" value="${pref.rows || 8}" style="width:64px"></label>
          <label class="f">Margin mm<input id="smargin" type="number" min="0" max="40" value="${pref.margin == null ? 10 : pref.margin}" style="width:70px"></label><label class="f">Gap mm<input id="sgap" type="number" min="0" max="30" value="${pref.gap == null ? 3 : pref.gap}" style="width:64px"></label></div>
        <div class="bar"><label><input id="snames" type="checkbox"${pref.names !== false ? ' checked' : ''}> Names under the codes</label><label><input id="soutline" type="checkbox"${pref.outline ? ' checked' : ''}> Cutting lines</label></div>
        <p class="dim" id="sinfo"></p>
        <div class="bar"><button id="sprint" class="main">Print</button><button id="ssvg">Save SVG pages</button></div>
        <p class="dim">Label sheets (Avery and the like): set Across, Down, Margin and Gap to the sheet’s layout, and print at 100% (Actual size).</p>
      </div><div class="sheetprev" id="sprev"></div></div>`;
    const read = () => { pref.sheetFrom = $('#sfrom').value; pref.copies = +$('#scopies').value || 1; pref.paper = $('#spaper').value; pref.cols = +$('#scols').value || 3; pref.rows = +$('#srows').value || 8; pref.margin = +$('#smargin').value; pref.gap = +$('#sgap').value; pref.names = $('#snames').checked; pref.outline = $('#soutline').checked; keepPref(); };
    const show = () => { read(); const s = sheetPages(), prev = $('#sprev'); prev.innerHTML = s.pages.slice(0, 6).map((p) => `<img class="page" alt="A page" style="width:min(100%, 520px)" src="${svgUrl(p)}">`).join('');
      $('#sinfo').textContent = `${s.n} barcode${s.n === 1 ? '' : 's'} · ${s.per} a page · ${s.pages.length} page${s.pages.length === 1 ? '' : 's'}${s.pages.length > 6 ? ' (first 6 shown)' : ''}`; };
    main.querySelectorAll('input, select').forEach((x) => x.addEventListener('input', show));
    $('#sprint').onclick = () => { const s = sheetPages(), area = $('#print-area'); let st = $('#page-size'); if (!st) { st = document.createElement('style'); st.id = 'page-size'; document.head.append(st); } st.textContent = `@page { size: ${s.pw}mm ${s.ph}mm; margin: 0; }`;
      area.innerHTML = s.pages.map((p) => `<div class="page"><img alt="" style="display:block;width:${s.pw}mm;height:${s.ph}mm" src="${svgUrl(p)}"></div>`).join(''); setTimeout(() => window.print(), 300); };
    $('#ssvg').onclick = () => { const s = sheetPages(); s.pages.forEach((p, i) => setTimeout(() => download(new Blob([p], { type: 'image/svg+xml' }), `barcode sheet${s.pages.length > 1 ? ' ' + (i + 1) : ''}.svg`), i * 400)); };
    show();
  }

  // ------------------------------------------------------------------ the page
  const VIEWS = { library, many: manyView, sheet: sheetView };
  function draw() { (VIEWS[view] || library)($('#main')); if (ribbon && ribbon.current && ribbon.current() !== view) ribbon.select(view); }
  const Bt = (label, icon, run, o = {}) => ({ label, icon, run, ...o });
  if (window.CraftRibbon) ribbon = window.CraftRibbon({ mount: $('#app'), storageKey: KEY, tabs: [
    { id: 'library', label: 'Library', hue: '#d99a00', onSelect: () => go('library'), groups: [
      ['Make', [Bt('New barcode', I.barcode, newOne, { big: true, title: 'A new barcode for the library' }), Bt('Make many', I.list, () => go('many'), { big: true, title: 'A whole list at once: one a line' })]],
      ['Library', [{ col: [Bt('Delete chosen', I.trash, () => removeChosen(B.library().filter((e) => chosen.has(e.id))), { title: 'Delete the chosen barcodes' }), Bt('Choose none', I.clear, () => { chosen.clear(); draw(); }), Bt('Choose all', I.check, () => { B.library().forEach((e) => chosen.add(e.id)); draw(); })] }, { col: [Bt('Save library file', I.save, exportLib, { title: 'Every barcode in the library as one file (to keep, or to take to another computer)' }), Bt('Open library file', I.open, importLib, { title: 'Add the barcodes from a library file' })] }]],
      ['Print', [Bt('Print a sheet', I.print, () => go('sheet'), { big: true, title: 'A page (or label sheet) of barcodes' })]],
      ['More', [Bt('Sheet designer', I.page, () => { location.href = 'designer.html'; }, { big: true, title: 'The canvas editor: barcodes with shapes, text and artwork on a label or page' })]] ] },
    { id: 'many', label: 'Make many', hue: '#2f6fdd', onSelect: () => go('many'), groups: [['Make many', [Bt('Back to the library', I.prev, () => go('library'), { big: true })]]] },
    { id: 'sheet', label: 'Print', hue: '#1e9e8a', onSelect: () => go('sheet'), groups: [['Sheets', [Bt('Back to the library', I.prev, () => go('library'), { big: true })]]] },
  ] });
  if (window.CraftTitlebar) tb = window.CraftTitlebar({ appName: 'BarcodeCraft', storageKey: KEY, colors: ['#d99a00', '#9a6a00'], mount: $('#app'), toast, logo: LOGO, ribbon,
    menus: () => [['File', [{ label: 'New barcode…', run: newOne }, { label: 'Make many', run: () => go('many') }, { label: 'Print a sheet…', run: () => go('sheet') }, { label: 'Save library file', run: exportLib }, { label: 'Open library file…', run: importLib }, { label: 'Sheet designer', run: () => { location.href = 'designer.html'; } }]]],
    quick: [{ icon: 'barcode', title: 'New barcode', run: newOne }, { icon: 'print', title: 'Print a sheet', run: () => go('sheet') }],
    getTitle: () => ({ library: 'Barcode library', many: 'Make many', sheet: 'Print a sheet' })[view] || 'BarcodeCraft', getStatus: () => ({ text: `${B.library().length} in the library` }), getInfo: () => [],
    rightEls: [window.CraftAccount && CraftAccount.button ? CraftAccount.button() : null].filter(Boolean) });
  if (ribbon) $('#app').prepend(ribbon.el); if (tb) $('#app').prepend(tb.el);
  const ic = document.createElement('link'); ic.rel = 'icon'; ic.href = 'data:image/svg+xml,' + encodeURIComponent(LOGO.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')); document.head.append(ic);
  window.addEventListener('craft-barcodes', () => { if (view === 'library') draw(); });
  window.addEventListener('craft-account', () => draw());
  // what BarcodeCraft offers its own window: the lines of Make many
  B.addSource('Make many', () => parseMany(pref.mText || '').slice(0, 200).map((x) => ({ label: x.name, value: x.value })));
  draw();
})();
</script>
